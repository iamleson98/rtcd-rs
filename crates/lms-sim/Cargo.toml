[package]
name = "lms-sim"
description = "A stand-in for the LMS around a real rtcd: the endpoints rtcd uploads a recording to and a class of synthetic participants, to test and measure the session recording"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rtcd = { path = "../rtcd" }
rtcd-proto = { path = "../rtcd-proto" }
rtcd-sfu = { path = "../rtcd-sfu" }
rtc = { path = "../../vendor/rtc" }
axum = "0.8.9"
base64 = "0.23.1"
bytes = "1.12.1"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "io-util"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
