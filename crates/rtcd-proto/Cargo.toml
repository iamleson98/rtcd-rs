[package]
name = "rtcd-proto"
description = "Wire formats shared by the rtcd service, its clients and the SFU: control-plane messages, data channel framing and session configuration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
flate2 = "1.1.10"
hmac = "0.13.0"
rmp = "0.8.15"
rmpv = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
thiserror = "2.0.21"

[dev-dependencies]
bcrypt = "0.19.3"
hex = "0.4.3"
