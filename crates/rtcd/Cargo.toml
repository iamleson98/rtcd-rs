[package]
name = "rtcd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
bcrypt = "0.19.3"
crc32fast = "1.5.0"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
hyper = { version = "1.12.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio", "service"] }
parking_lot = "0.12.5"
prometheus = { version = "0.14.0", features = ["process"] }
rand = "0.10.3"
recorder = { version = "0.1.0", path = "../recorder" }
redb = "4.4.0"
rtcd-net = { version = "0.1.0", path = "../rtcd-net" }
rtcd-proto = { version = "0.1.0", path = "../rtcd-proto" }
rtcd-sfu = { version = "0.1.0", path = "../rtcd-sfu" }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
toml = "1.1.8"
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }

[dev-dependencies]
bytes = "1.12.1"
recorder = { path = "../recorder", features = ["testing"] }
base64 = "0.23.1"
bcrypt = "0.19.3"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", features = ["json"] }
rtcd-testkit = { path = "../rtcd-testkit" }
tokio = { version = "1.54.1", features = ["test-util"] }
tokio-tungstenite = "0.30.0"
