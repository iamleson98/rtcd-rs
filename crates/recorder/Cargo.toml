[package]
name = "recorder"
description = "The files of a session recording (WebM from a call's streams) and their upload to the LMS, as rtcd records a call"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The fake LMS and storage the tests of this crate and of rtcd talk to.
testing = ["dep:axum"]

[dependencies]
axum = { version = "0.8.9", optional = true }
bytes = "1.12.1"
futures-util = "0.3.34"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "sync", "time", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
thiserror = "2.0.21"
tracing = "0.1.44"

[dev-dependencies]
axum = "0.8.9"
