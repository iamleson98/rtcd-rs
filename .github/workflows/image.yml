# Publish the image (ghcr.io/<owner>/rtcd-rust): on a version tag, or by hand from the Actions tab.
# It is signed keyless with this workflow's identity and carries an SBOM and build provenance.
name: image

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: "An extra tag besides sha-<commit> (for example canary-1)"
        required: false
        default: ""

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  image:
    name: Build, push and sign
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/rtcd-rust
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{raw}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
      - name: Build & push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/rtcd-rust
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          {
            echo "### rtcd-rust"
            echo
            echo "- image: \`${IMAGE}@${DIGEST}\`"
            echo "- tags: \`$(echo "${{ steps.meta.outputs.tags }}" | tr '\n' ' ')\`"
          } >> "$GITHUB_STEP_SUMMARY"
