name: lesson-soak

# Two profiles, each for two hours against this repository's rtcd and against the upstream Go rtcd
# it replaced, on x64 and on arm64 (see scripts/lesson-soak/README.md):
#   lesson: a real lesson: a teacher, 25 students, Chromium receivers, a network that misbehaves
#           for part of the class.
#   abuse:  the same lesson with the SFU held at the limit: a background load of 90 % of the lower of
#           the two services' ceilings (found by `calibrate` on the same runner type), churn, hostile
#           clients, junk and signaling abuse, and a network abuse profile for each participant, from
#           one seed (the run id) so both services meet the same attacks.
# rtcd-rs runs twice, with the camera budget off (`rs`) and on (`rs-budget`, the same image; the
# variable is set explicitly for each), beside the Go rtcd (`go`). The report compares the first and
# the last clean stretch of each service, holds rtcd-rs as it ships (`rs`) against the Go rtcd (the
# same lesson, the same network, the same machine type) and fails when it drifts, crashes or is less
# stable; rtcd-rs-budget against the Go rtcd and against rtcd-rs is in the report only (gated only
# when `rs` did not run).

on:
  schedule:
    - cron: '0 2 * * 6'
  workflow_dispatch:
    inputs:
      minutes:
        description: "Length of the lesson in minutes"
        required: false
        default: "120"
      cycle:
        description: "Minutes in one cycle of network phases"
        required: false
        default: "20"
      budget:
        description: "Camera budget legs: both (rs, rs-budget, go), on (rs-budget, go) or off (rs, go)"
        type: choice
        options: [both, on, off]
        default: both
  pull_request:
    paths:
      - 'crates/lms-sim/**'
      - 'scripts/lesson-soak/**'
      - '.github/workflows/lesson-soak.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      impls: ${{ steps.plan.outputs.impls }}
      minutes: ${{ steps.plan.outputs.minutes }}
      cycle: ${{ steps.plan.outputs.cycle }}
      ramp_step: ${{ steps.plan.outputs.ramp_step }}
      ramp_per_step: ${{ steps.plan.outputs.ramp_per_step }}
      ramp_max: ${{ steps.plan.outputs.ramp_max }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          MINUTES: ${{ inputs.minutes }}
          CYCLE: ${{ inputs.cycle }}
          BUDGET: ${{ inputs.budget }}
        run: |
          case "$EVENT" in
            pull_request) minutes=10 cycle=5 ramp_step=20 ramp_per_step=1 ramp_max=6 ;;
            workflow_dispatch) minutes=$MINUTES cycle=$CYCLE ramp_step=40 ramp_per_step=2 ramp_max=30 ;;
            *) minutes=120 cycle=20 ramp_step=40 ramp_per_step=2 ramp_max=30 ;;
          esac
          case "$minutes$cycle" in *[!0-9]*|'') echo "minutes and cycle must be whole numbers"; exit 1 ;; esac
          [ "$minutes" -le 150 ] || { echo "a lesson is at most 150 minutes (the job's timeout is 180)"; exit 1; }
          # The services to run: the budget legs, and always the Go baseline. A run that is not started
          # by hand (and so has no input) and a pull request run all three.
          case "${BUDGET:-both}" in
            both) impls='["rs","rs-budget","go"]' ;;
            on) impls='["rs-budget","go"]' ;;
            off) impls='["rs","go"]' ;;
            *) echo "budget is both, on or off"; exit 1 ;;
          esac
          # The calibration ramp: at most ramp_max / ramp_per_step steps of ramp_step seconds for each
          # service, so the two of them fit the calibrate job's 60 minutes with the image builds.
          {
            echo "impls=$impls"
            echo "minutes=$minutes"
            echo "cycle=$cycle"
            echo "ramp_step=$ramp_step"
            echo "ramp_per_step=$ramp_per_step"
            echo "ramp_max=$ramp_max"
          } >> "$GITHUB_OUTPUT"

  lesson:
    name: Lesson (${{ matrix.impl }}, ${{ matrix.arch }})
    needs: plan
    runs-on: ${{ matrix.os }}
    # A lesson is at most 150 minutes (checked in Plan); expressions have no arithmetic.
    timeout-minutes: 180
    # The Go baseline failing (killed for memory, crashed) is its finding, not rtcd-rs's: the report
    # shows it and compares rtcd-rs over the minutes the baseline ran.
    continue-on-error: ${{ matrix.impl == 'go' }}
    strategy:
      fail-fast: false
      matrix:
        impl: ${{ fromJSON(needs.plan.outputs.impls) }}
        arch: [x64, arm64]
        include:
          - { arch: x64, os: ubuntu-latest }
          - { arch: arm64, os: ubuntu-24.04-arm }
    env:
      # One seed for every service and architecture of this run (not the date: a run can span midnight).
      SEED: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Kernel modules for the network shaping
        run: |
          sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)" || true
          sudo modprobe ifb sch_netem sch_htb act_mirred cls_u32 || true
          lsmod | grep -E '^(ifb|sch_netem|sch_htb|act_mirred|cls_u32) ' || true
      - name: Run the lesson
        run: >
          scripts/ci-run.sh
          scripts/lesson-soak/run.sh
          ${{ matrix.impl }} ${{ needs.plan.outputs.minutes }} ${{ needs.plan.outputs.cycle }} out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lesson-soak-lesson-${{ matrix.impl }}-${{ matrix.arch }}
          path: out/
          retention-days: 30

  calibrate:
    name: Calibrate (${{ matrix.arch }})
    needs: plan
    runs-on: ${{ matrix.os }}
    # Both services are ramped one after the other on this runner; the ramp is budgeted in Plan.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        include:
          - { arch: x64, os: ubuntu-latest }
          - { arch: arm64, os: ubuntu-24.04-arm }
    env:
      RAMP_STEP_SECS: ${{ needs.plan.outputs.ramp_step }}
      RAMP_CLASSES_PER_STEP: ${{ needs.plan.outputs.ramp_per_step }}
      RAMP_MAX_CLASSES: ${{ needs.plan.outputs.ramp_max }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Ramp rtcd-rs
        run: scripts/ci-run.sh scripts/lesson-soak/calibrate.sh rs out
      - name: Ramp the Go rtcd
        run: scripts/ci-run.sh scripts/lesson-soak/calibrate.sh go out
      # 90 % of the lower ceiling, the same load for both services. (A job output cannot carry it: the
      # outputs of the matrix legs overwrite each other, so the abuse jobs read hold.txt from the artifact.)
      - name: The load to hold
        run: |
          arch=$(uname -m)
          python3 scripts/lesson-soak/hold.py "$arch" "out/ceiling-rs-$arch.json" "out/ceiling-go-$arch.json" --out out/hold.txt
      - name: Ceilings in the summary
        if: always()
        run: |
          {
            echo "### Ceilings (${{ matrix.arch }})"
            cat out/ceiling-*.json out/hold.txt 2>/dev/null || echo "none"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lesson-soak-calibrate-${{ matrix.arch }}
          path: out/
          retention-days: 30

  abuse:
    name: Abuse (${{ matrix.impl }}, ${{ matrix.arch }})
    needs: [plan, calibrate]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    # As in the lesson job: a Go baseline that does not survive the abuse is reported, not a failure.
    continue-on-error: ${{ matrix.impl == 'go' }}
    strategy:
      fail-fast: false
      matrix:
        impl: ${{ fromJSON(needs.plan.outputs.impls) }}
        arch: [x64, arm64]
        include:
          - { arch: x64, os: ubuntu-latest }
          - { arch: arm64, os: ubuntu-24.04-arm }
    env:
      PROFILE: abuse
      # One seed for every service and architecture of this run, so that all meet the same attacks.
      SEED: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Kernel modules for the network shaping
        run: |
          sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)" || true
          sudo modprobe ifb sch_netem sch_htb act_mirred cls_u32 || true
          lsmod | grep -E '^(ifb|sch_netem|sch_htb|act_mirred|cls_u32) ' || true
      - uses: actions/download-artifact@v4
        with:
          name: lesson-soak-calibrate-${{ matrix.arch }}
          path: calibrate
      - name: The load to hold
        run: |
          hold=$(sed -n 's/^hold_classes=//p' calibrate/hold.txt)
          case "$hold" in ''|*[!0-9]*) echo "::error::no hold_classes from the calibration"; exit 1 ;; esac
          echo "LOAD_CLASSES=$hold" >> "$GITHUB_ENV"
          echo "holding $hold background classes, seed $SEED"
      - name: Run the abuse soak
        run: >
          scripts/ci-run.sh
          scripts/lesson-soak/run.sh
          ${{ matrix.impl }} ${{ needs.plan.outputs.minutes }} ${{ needs.plan.outputs.cycle }} out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lesson-soak-abuse-${{ matrix.impl }}-${{ matrix.arch }}
          path: out/
          retention-days: 30

  report:
    name: Report (${{ matrix.profile }}, ${{ matrix.arch }})
    needs: [plan, lesson, abuse]
    if: always() && (needs.lesson.result != 'skipped' || needs.abuse.result != 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [lesson, abuse]
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          pattern: lesson-soak-${{ matrix.profile }}-*-${{ matrix.arch }}
          path: soak
      - name: Every soak produced its measurements
        id: inputs
        env:
          IMPLS: ${{ join(fromJSON(needs.plan.outputs.impls), ' ') }}
        run: |
          set +e
          missing=0
          read -ra impls <<<"$IMPLS"
          for impl in "${impls[@]}"; do
            dir=soak/lesson-soak-${{ matrix.profile }}-$impl-${{ matrix.arch }}
            if [ -z "$(find "$dir" -name 'rtcd-*.jsonl' -size +0 2>/dev/null)" ]; then
              echo "::error::no measurements from the $impl ${{ matrix.profile }} soak on ${{ matrix.arch }}"
              missing=1
            fi
          done
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Compare
        id: report
        env:
          IMPLS: ${{ join(fromJSON(needs.plan.outputs.impls), ' ') }}
        run: |
          set +e
          rules=scripts/lesson-soak/rules.json
          [ "${{ matrix.profile }}" = abuse ] && rules=scripts/lesson-soak/rules-abuse.json
          # The pairs for the services that ran (see pairs.py).
          read -ra impls <<<"$IMPLS"
          python3 scripts/lesson-soak/pairs.py "$rules" pairs.json "${impls[@]}"
          python3 vendor/rtc/benchmarks/soak/report.py --rules pairs.json --out report soak/*/rtcd-*.jsonl
          echo "status=$?" >> "$GITHUB_OUTPUT"
          if [ -f report/summary.md ]; then
            {
              echo "## ${{ matrix.profile }}, ${{ matrix.arch }}"
              cat report/summary.md
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lesson-soak-report-${{ matrix.profile }}-${{ matrix.arch }}
          path: |
            report/report.html
            report/summary.md
            soak/*/rtcd-*.jsonl
            soak/*/machine.txt
            soak/*/seed.txt
          retention-days: 30
      - name: Fail when a soak failed, left nothing, or rtcd-rs breached a rule
        if: always() && (matrix.profile == 'lesson' && needs.lesson.result != 'success' || matrix.profile == 'abuse' && needs.abuse.result != 'success' || steps.inputs.outputs.missing != '0' || steps.report.outputs.status != '0')
        run: |
          echo "soak jobs: lesson ${{ needs.lesson.result }}, abuse ${{ needs.abuse.result }}; missing measurements: ${{ steps.inputs.outputs.missing }}; report status: ${{ steps.report.outputs.status }}"
          exit 1
