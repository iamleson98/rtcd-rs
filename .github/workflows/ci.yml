name: ci

# The Rust rtcd and its session recording: formatting, lints, the whole test suite (on Linux, where the
# batched socket paths run), a dependency audit, and the Docker image.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # image.yml runs the whole suite as the gate of a release.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Not ${{ github.workflow }}: called from image.yml that is the caller's name, which is also
  # the start of the caller's own concurrency group.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  check:
    name: Format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: ./scripts/ci-run.sh cargo fmt --all --check
      - run: ./scripts/ci-run.sh cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm, macos-latest ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal
      - run: ./scripts/ci-run.sh cargo test --workspace --locked --no-fail-fast

  fuzz:
    name: Fuzz targets (a short run each)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Run every target for a minute
        working-directory: fuzz
        run: |
          for t in $(cargo +nightly fuzz list); do
            "${GITHUB_WORKSPACE}"/scripts/ci-run.sh cargo +nightly fuzz run "$t" -- -max_total_time=60 -max_len=4096
          done

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: ./scripts/ci-run.sh cargo audit --deny warnings

  soak-scripts:
    name: Lesson soak scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Python (calibration, picture scores)
        run: python3 -m unittest discover -s scripts/lesson-soak -p 'test_*.py'
      - name: Node (the picture score's matching)
        run: node --test scripts/lesson-soak/chrome/quality.test.mjs

  image:
    name: Docker image (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build
        run: docker build --build-arg BUILD_NUMBER=ci-test --build-arg BUILD_HASH="${GITHUB_SHA}" -t rtcd-rust .
      - name: Start with the reference config and ask for the version
        run: |
          # shellcheck disable=SC2016  # the inner bash expands GITHUB_WORKSPACE
          ./scripts/ci-run.sh bash -c '
            docker run -d --name rtcd -p 8045:8045 \
              -v "${GITHUB_WORKSPACE}/deploy/rtcd.toml:/etc/rtcd/rtcd.toml:ro" \
              -e RTCD_API_SECURITY_ALLOWSELFREGISTRATION=true -e RTCD_RTC_ICEHOSTOVERRIDE=127.0.0.1 rtcd-rust
            curl --fail --retry 20 --retry-delay 1 --retry-connrefused --retry-all-errors http://127.0.0.1:8045/version \
              | tee /dev/stderr | grep -q "ci-test" \
              || { docker ps -a; docker logs rtcd; exit 1; }
            docker logs rtcd'
