name: ci

# The Rust rtcd and the session recorder: formatting, lints, the whole test suite (on Linux, where the
# batched socket paths run, and with ffmpeg, which the recorder's end-to-end tests use to make real
# media and to check what was recorded), a dependency audit, and the Docker images.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  check:
    name: Format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: $GITHUB_WORKSPACE/scripts/ci-run.sh cargo fmt --all --check
      - run: $GITHUB_WORKSPACE/scripts/ci-run.sh cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      # The recorder's end-to-end tests make real VP8 and Opus with ffmpeg and read the recordings
      # back with ffprobe; where it is not installed they do nothing.
      - name: ffmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: $GITHUB_WORKSPACE/scripts/ci-run.sh cargo test --workspace --locked --no-fail-fast

  fuzz:
    name: Fuzz targets (a short run each)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Run every target for a minute
        working-directory: fuzz
        run: |
          for t in $(cargo +nightly fuzz list); do
            $GITHUB_WORKSPACE/scripts/ci-run.sh cargo +nightly fuzz run "$t" -- -max_total_time=60 -max_len=4096
          done

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: $GITHUB_WORKSPACE/scripts/ci-run.sh cargo audit --deny warnings

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        run: docker build -t rtcd-rust .
      - name: Start through the entrypoint and ask for the version
        run: |
          $GITHUB_WORKSPACE/scripts/ci-run.sh bash -c '
            docker run -d --name rtcd -p 8045:8045 -e RTCD_ICE_HOST_OVERRIDE=127.0.0.1 rtcd-rust
            curl --fail --retry 20 --retry-delay 1 --retry-connrefused --retry-all-errors http://127.0.0.1:8045/version \
              || { docker ps -a; docker logs rtcd; exit 1; }
            docker logs rtcd'

  recorder-image:
    name: Recorder image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        run: docker build -f deploy/recorder.Dockerfile --build-arg BUILD_HASH=${GITHUB_SHA::8} -t lms-recorder .
      - name: It is small, static, and runs without a shell
        run: |
          $GITHUB_WORKSPACE/scripts/ci-run.sh bash -c '
            docker image inspect lms-recorder --format "{{.Size}} bytes"
            docker run --rm lms-recorder version | tee version.txt
            grep -q "^recorder rust" version.txt
            # Without its environment it refuses and says why, as the job runner would see.
            set +e; out=$(docker run --rm lms-recorder 2>&1); code=$?; set -e
            echo "$out"
            test "$code" = 2
            echo "$out" | grep -q "invalid configuration"'
