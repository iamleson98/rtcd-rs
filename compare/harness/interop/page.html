<!doctype html>
<meta charset="utf-8">
<title>class</title>
<body>
<script>
// One class: a teacher with a camera, a speaker, a viewer of the large camera, a viewer of the small
// one, and a listener. Each is a frame running the LMS call client; this page drives them in phases
// and reports statistics after each to the bridge, which judges them.
const people = [
  ['teacher', 'teacher'], ['speaker', 'speaker'], ['viewer', 'viewer'], ['small', 'viewer-low'], ['listener', 'listener'],
];
const call = 'class';
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const errors = [];
const progress = (m) => fetch('/log?m=' + encodeURIComponent(m)).catch(() => {});
window.addEventListener('error', (e) => errors.push(String(e.message)));

async function frameFor([name, role]) {
  const frame = document.createElement('iframe');
  frame.allow = 'camera; microphone; autoplay';
  frame.src = `/p.html?name=${name}&role=${role}&call=${call}&${location.search.slice(1)}`;
  document.body.appendChild(frame);
  for (let i = 0; i < 200 && !frame.contentWindow.api; i++) await sleep(50);
  if (!frame.contentWindow.api) throw new Error(`${name}: no harness`);
  return frame.contentWindow.api;
}

async function snap(apis) {
  return Promise.all(apis.map((a) => a.report()));
}

(async () => {
  const result = { joinMs: [], snaps: [], errors };
  try {
    progress('frames');
    const apis = await Promise.all(people.map(frameFor));
    progress('frames ready');
    const byName = Object.fromEntries(apis.map((a) => [a.name, a]));
    // The teacher starts the class, then the others come in.
    result.joinMs.push(await byName.teacher.join());
    result.joinMs.push(...(await Promise.all(apis.filter((a) => a.name !== 'teacher').map((a) => a.join()))));
    progress('joined');
    byName.viewer.watch('browser-teacher', false);
    byName.small.watch('browser-teacher', true);
    byName.listener.watch(null, false);
    await sleep(9000);
    result.snaps.push(await snap(apis));
    progress('snap 1');

    await byName.teacher.setCamera(false);
    progress('camera off');
    await sleep(3000);
    result.snaps.push(await snap(apis));

    await byName.teacher.setCamera(true);
    progress('camera on');
    await byName.speaker.setMic(false);
    await sleep(2000);
    await byName.speaker.setMic(true);
    await sleep(5000);
    result.snaps.push(await snap(apis));

    apis.forEach((a) => a.leave());
  } catch (e) {
    errors.push(String(e && e.stack || e));
  }
  await fetch('/result', { method: 'POST', body: JSON.stringify(result) });
})();
</script>
